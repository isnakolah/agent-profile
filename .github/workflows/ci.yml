name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.4'}
      - name: Test Go source when present
        run: |
          if [ -f go.mod ]; then
            go test -race ./...
            go vet ./...
          else
            echo 'No Go module yet; bootstrap policy files only.'
          fi
