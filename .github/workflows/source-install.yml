name: source-install
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  install:
    strategy:
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install checked-out source
        run: GOBIN="$RUNNER_TEMP/bin" go install ./cmd/agent-profile
      - name: Verify in an isolated state root
        env:
          AGENT_PROFILE_HOME: ${{ runner.temp }}/agent-profile-smoke
        run: |
          "$RUNNER_TEMP/bin/agent-profile" version
          "$RUNNER_TEMP/bin/agent-profile" doctor --json
          "$RUNNER_TEMP/bin/agent-profile" session list --json
