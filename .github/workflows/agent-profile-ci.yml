name: agent-profile CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 120s ./...
      - name: Native Keychain round trip
        if: runner.os == 'macOS'
        run: AP_VAULT_INTEGRATION=1 go test ./internal/credentials -timeout 30s
      - name: Install Linux vault test dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Secret Service round trip
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -c 'printf "\n" | gnome-keyring-daemon --unlock --components=secrets; AP_VAULT_INTEGRATION=1 go test ./internal/credentials -timeout 30s'
      - run: go vet ./...
      - run: go build -o "$RUNNER_TEMP/agent-profile" ./cmd/agent-profile
      - name: Isolated source-install smoke
        run: |
          export AGENT_PROFILE_HOME="$RUNNER_TEMP/profile-data"
          GOBIN="$RUNNER_TEMP/bin" go install ./cmd/agent-profile
          "$RUNNER_TEMP/bin/agent-profile" version
          "$RUNNER_TEMP/bin/agent-profile" doctor --json
          "$RUNNER_TEMP/bin/agent-profile" session list --json
