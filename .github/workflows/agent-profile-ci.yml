name: agent-profile CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/agent-profile

CI policy: source-install and matrix checks are required delivery gates.
